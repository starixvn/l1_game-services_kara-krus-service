version: "3.7"

services:
  app:
    build:
      context: ./
      dockerfile: integration-test.Dockerfile
    command: yarn run test-:-integration-:-start-service
    volumes:
      - .:/app/
      - /app/node_modules
    ports:
      - 5001:5001
  
  mongo:
    image: mongo
    restart: always
    ports:
      - 27017:27017
    
