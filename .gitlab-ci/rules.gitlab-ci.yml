.if-deploy-all: &if-deploy-all
    if: '$CI_COMMIT_TAG =~ /^l1-deploy-\d{8}-\d+.*$/'

.if-deploy-local: &if-deploy-local
    if: '$CI_COMMIT_TAG =~ /^l1-deploy-local-\d{8}-\d+.*$/'

.if-deploy-sit: &if-deploy-sit
    if: '$CI_COMMIT_TAG =~ /^l1-deploy-sit-\d{8}-\d+.*$/'

.if-deploy-uat: &if-deploy-uat
    if: '$CI_COMMIT_TAG =~ /^l1-deploy-uat-\d{8}-\d+.*$/'

.if-deploy-prod: &if-deploy-prod
    if: '$CI_COMMIT_BRANCH == "master"'

.build:image:rules:
    rules:
        - <<: *if-deploy-local
          when: always
        - <<: *if-deploy-all
          when: always
        - <<: *if-deploy-sit
          when: always
        - <<: *if-deploy-uat
          when: always
        - <<: *if-deploy-prod
          when: manual

.deploy:local:rules:
    rules:
        - <<: *if-deploy-local
          when: always
        - <<: *if-deploy-all
          when: always
        - when: never
  
.deploy:sit:rules:
    rules:
        - <<: *if-deploy-sit
          when: always
        - <<: *if-deploy-all
          when: always
        - when: never

.deploy:uat:rules:
    rules:
        - <<: *if-deploy-uat
          when: always
        - <<: *if-deploy-all
          when: always
        - when: never

.deploy:prod:rules:
    rules:
        - <<: *if-deploy-prod
          when: manual