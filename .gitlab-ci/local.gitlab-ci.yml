##############
# Conditions #
##############
.if-local: &if-local
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-local-\d{8}-\d+.*$/'

build_local:
  extends:
      - .base_build
  environment:
      name: LOCAL
  rules:
      - <<: .if-local
        when: always
      - if: $CI_COMMIT_TAG =~ /^l1-deploy-\d{8}-\d+.*$/
        when: always
      - when: never

deploy_local:
  extends:
    - .base_deploy
  variables:
    SERVER_IP: 10.10.50.14
    SERVER_USER: root
  environment:
    name: LOCAL
  rules:
    - <<: .if-local
      when: always
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-\d{8}-\d+.*$/
      when: always
    - when: never