.base_deploy_local:
    stage: deploy
    script:
      - export CONFIG_FILE=app-configs.${DEPLOY_ENV}.js
      - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "mkdir -p $WORKING_PATH"
      - scp ./configs/$CONFIG_FILE $SERVER_USER@$SERVER_IP:$WORKING_PATH
      - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP
          "(docker login -u $DOCKER_REG_USERNAME -p $DOCKER_REG_PASSWORD $DOCKER_REG_URL)
          && docker pull $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION
          && (docker rm -f $DOCKER_SERVICE_NAME-$DEPLOY_ENV || true)
          && docker run --restart=always --name $DOCKER_SERVICE_NAME-$DEPLOY_ENV -p $APP_PORT:$APP_PORT -v $WORKING_PATH/$CONFIG_FILE:/app/src/app-configs.js -d $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION"
    tags:
        - docker
  
.base_deploy_kbt:
    extends:
        - .base_deploy_local
    script:
        - export CONFIG_FILE=app-configs.${DEPLOY_ENV}.js
        - ssh -p $KBT_PROXY_SSH_PORT -t $KBT_PROXY_USER@$KBT_PROXY_ADDRESS ssh -p $SERVER_PORT $SERVER_USER@$SERVER_IP mkdir -p $WORKING_PATH
        - scp -P $SERVER_PORT -o ProxyCommand="ssh -p $KBT_PROXY_SSH_PORT -W %h:%p $KBT_PROXY_USER@$KBT_PROXY_ADDRESS" ./configs/$CONFIG_FILE $SERVER_USER@$SERVER_IP:$WORKING_PATH
        - ssh -p $KBT_PROXY_SSH_PORT -t $KBT_PROXY_USER@$KBT_PROXY_ADDRESS ssh -p $SERVER_PORT $SERVER_USER@$SERVER_IP docker login -u $DOCKER_REG_USERNAME -p $DOCKER_REG_PASSWORD $DOCKER_REG_URL
        - ssh -p $KBT_PROXY_SSH_PORT -t $KBT_PROXY_USER@$KBT_PROXY_ADDRESS ssh -p $SERVER_PORT $SERVER_USER@$SERVER_IP docker pull $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION
        - ssh -p $KBT_PROXY_SSH_PORT -t $KBT_PROXY_USER@$KBT_PROXY_ADDRESS ssh -p $SERVER_PORT $SERVER_USER@$SERVER_IP docker rm -f $DOCKER_SERVICE_NAME-$DEPLOY_ENV || true
        - ssh -p $KBT_PROXY_SSH_PORT -t $KBT_PROXY_USER@$KBT_PROXY_ADDRESS ssh -p $SERVER_PORT $SERVER_USER@$SERVER_IP docker run --restart=always --name $DOCKER_SERVICE_NAME-$DEPLOY_ENV -p $APP_PORT:$APP_PORT -v $WORKING_PATH/$CONFIG_FILE:/app/src/app-configs.js -d $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION
