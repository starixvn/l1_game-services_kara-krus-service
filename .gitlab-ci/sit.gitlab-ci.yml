build_sit:
  extends:
      - .base_build
  environment:
      name: SIT
  rules:
      - if: '$CI_COMMIT_TAG =~ /^l1-deploy-sit-\d{8}-\d+.*$/'
        when: always
      - if: $CI_COMMIT_TAG =~ /^l1-deploy-\d{8}-\d+.*$/
        when: always
      - when: never

deploy_sit:
  extends:
    - .base_deploy_kbt
  needs: ["build_sit"]
  variables:
    SERVER_IP: 10.2.189.65
    SERVER_USER: l1uat
    SERVER_PORT: 8837
  environment:
    name: SIT
  rules:
    - if: '$CI_COMMIT_TAG =~ /^l1-deploy-sit-\d{8}-\d+.*$/'
      when: always
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-\d{8}-\d+.*$/
      when: always
    - when: never