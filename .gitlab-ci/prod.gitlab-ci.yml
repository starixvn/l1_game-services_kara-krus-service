build_prod:
  extends:
    - .base_build
  environment:
      name: PROD
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    when: manual

deploy_prod:
  extends:
    - .base_deploy_kbt
  needs: ["build_prod"]
  variables:
    SERVER_IP: 10.2.189.61
    SERVER_USER: v1app
    SERVER_PORT: 22
    APP_PORT: 8000
  environment:
    name: PROD
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    when: manual