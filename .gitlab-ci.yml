stages:
  - test
  - post-test
  - build
  - post-build
  - deploy  
  - smoke-test

variables:
  DOCKER_COMPOSE_REPO_URL: git@git3.nexdev.net:ci/repos-ci/pentagon_l1_sedie_service.git
  PROJECT_NAME: l1-sedie-service
  SRC_PATH: ./src
  TEST_PATH: ./src

include:

  - project: "ci/common-ci"
    ref: rocketor
    file: "unit-test/js-unit-test.gitlab-ci.yml"
  - project: "ci/common-ci"
    ref: rocketor
    file: "sonarqube/sonarqube.js-unittest.gitlab-ci.yml"  

  - project: 'ci/common-ci'
    ref: rocketor
    file: 'rocketor-integration/rules/index.gitlab-ci.yml'
  - project: 'ci/common-ci'
    ref: rocketor
    file: 'docker/base/build-docker-image.gitlab-ci.yml'
  - project: 'ci/common-ci'
    ref: rocketor
    file: 'docker/base/post-build-docker-image.gitlab-ci.yml'
  - project: 'ci/common-ci'
    ref: rocketor
    file: '_teams/luminet/pentagon/deploy-docker-swarm-stack/index.gitlab-ci.yml'
  - project: "ci/repos-ci/pentagon_l1_sedie_service"
    ref: master
    file: ".gitlab-ci/sedie_service/build.gitlab-ci.yml"
  - project: "ci/repos-ci/pentagon_l1_sedie_service"
    ref: master
    file: ".gitlab-ci/sedie_service/deploy-vars.gitlab-ci.yml"
  - project: "ci/repos-ci/pentagon_l1_sedie_service"
    ref: master
    file: ".gitlab-ci/sedie_service/rules.gitlab-ci.yml"
  - project: "ci/repos-ci/pentagon_l1_sedie_service"
    ref: master
    file: ".gitlab-ci/sedie_service/deploy-local.gitlab-ci.yml"
  - project: "ci/repos-ci/pentagon_l1_sedie_service"
    ref: master
    file: ".gitlab-ci/sedie_service/deploy-sit.gitlab-ci.yml"
  - project: "ci/repos-ci/pentagon_l1_sedie_service"
    ref: master
    file: ".gitlab-ci/sedie_service/deploy-uat.gitlab-ci.yml"
  - project: "ci/repos-ci/pentagon_l1_sedie_service"
    ref: master
    file: ".gitlab-ci/sedie_service/deploy-prod.gitlab-ci.yml"
  - project: "ci/repos-ci/pentagon_l1_sedie_service"
    ref: master
    file: ".gitlab-ci/sedie_service/deploy-aws.gitlab-ci.yml"

smoketest-run:
  stage: smoke-test
  variables:
    PRODUCT: SEDIE
  trigger: 
    project: rnd/testing/mocha-playwright
    branch: master