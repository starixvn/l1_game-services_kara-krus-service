variables:
  WORKING_PATH: /var/www/l1/sedie-service
  SERVER_IP: 10.10.50.14
  SERVER_USER: root

stages:
  - build
  - deploy

before_script:
  - docker info
  - echo $CURRENT_TAG
  # - if echo "$CI_COMMIT_TAG" | grep -q "$CURRENT_TAG";
  #   then
  #     echo "Continue deploying";
  #   else
  #     echo "This job has tag is not used for current repository";
  #     exit 1;
  #   fi
  - eval $(ssh-agent -s)
  - echo "$SSH_KEY" | ssh-add -
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)

build_sedie_image:
  stage: build
  script:
      #- cp ./src/app-configs.${CI_ENVIRONMENT_NAME}.js ./src/app-configs.js
      - echo "$DOCKER_REG_PASSWORD" | docker login -u "$DOCKER_REG_USERNAME" "$DOCKER_REG_URL" --password-stdin
      - docker build --tag $DOCKER_REG_URL/lumi_ci/game-sedie-service:latest -f Dockerfile .
      - docker push $DOCKER_REG_URL/lumi_ci/game-sedie-service:latest
  tags:
      - docker-nodejs
  environment:
    name: LOCAL

deploy_sedie:
  stage: deploy
  script:
      - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "mkdir $WORKING_PATH"
      - scp ./app-configs.${CI_ENVIRONMENT_NAME}.js $SERVER_USER@$SERVER_IP:$WORKING_PATH
      - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP 
            "(echo $DOCKER_REG_PASSWORD | docker login -u $DOCKER_REG_USERNAME $DOCKER_REG_URL --password-stdin)
            && (docker pull $DOCKER_REG_URL/lumi_ci/game-sedie-service:latest)
            && (docker rm -f sedie-service || true)
            && docker run --name sedie-service -p 8082:8082 -v $WORKING_PATH/app-configs-LOCAL.js:/src/app-configs.js -d $DOCKER_REG_URL/lumi_ci/game-sedie-service:latest"
  tags:
      - docker-nodejs
  environment:
    name: LOCAL
