variables:
  WORKING_PATH: /var/www/l1/sedie-service/
  KBT_PROXY_ADDRESS: l1deployment.starific.net
  KBT_PROXY_SSH_PORT: 8837
  KBT_PROXY_USER: l1uat

stages:
  - build
  - deploy

before_script:
  - docker info
  - echo $CURRENT_TAG
  - if echo "$CI_COMMIT_TAG" | grep -q "$CURRENT_TAG";
    then
      export DEPLOY_ENV=$CI_ENVIRONMENT_NAME;
      echo "Continue deploying";
    elif [ "$CI_COMMIT_BRANCH" == "master" ]; 
    then
      export DEPLOY_ENV=PROD;
      echo "Continue deploying";
    else
      echo "This job has tag is not used for current repository";
      exit 1;
    fi
  - eval $(ssh-agent -s)
  - echo "$SSH_KEY" | ssh-add -
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
  - export CI_REGISTRY_IMAGE=$DOCKER_REG_URL/lumi_ci/game-sedie-service
  - export CI_REGISTRY_IMAGE_VERSION=${CI_COMMIT_SHA:0:8}
  - echo $CI_REGISTRY_IMAGE

.base_build:
  stage: build
  script:
      - docker pull $CI_REGISTRY_IMAGE:latest || true
      - echo "$DOCKER_REG_PASSWORD" | docker login -u "$DOCKER_REG_USERNAME" "$DOCKER_REG_URL" --password-stdin
      - docker build 
        --pull
        -f Dockerfile 
        --tag $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION 
        --cache-from $CI_REGISTRY_IMAGE:latest .
      - docker push $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION
      - docker tag $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION $CI_REGISTRY_IMAGE:latest
      - docker push $CI_REGISTRY_IMAGE:latest
      - docker tag $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest
      - docker push $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest
  tags:
      - docker-nodejs

.base_deploy:
  stage: deploy
  script:
    - export CONFIG_FILE=app-configs.${DEPLOY_ENV}.js
    - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "mkdir -p $WORKING_PATH"
    - scp ./configs/$CONFIG_FILE $SERVER_USER@$SERVER_IP
    - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP
        "(echo $DOCKER_REG_PASSWORD | docker login -u $DOCKER_REG_USERNAME $DOCKER_REG_URL --password-stdin)
        && docker pull $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest
        && (docker rm -f sedie-service || true)
        && docker run --name sedie-service -p 8082:8082 -v $WORKING_PATH/$CONFIG_FILE:/src/app-configs.js -d $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest
        && echo y | docker image prune -a"
  tags:
      - docker-nodejs

.base_deploy_kbt:
  extends:
    - .base_deploy
  script:
    - export CONFIG_FILE=app-configs.${DEPLOY_ENV}.js
    - ssh -p $KBT_PROXY_SSH_PORT -t $KBT_PROXY_USER@$KBT_PROXY_ADDRESS ssh -p $SERVER_PORT -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP mkdir -p $WORKING_PATH
    - scp -P $KBT_PROXY_SSH_PORT -o ProxyCommand="ssh -p $KBT_PROXY_SSH_PORT -W %h:%p $KBT_PROXY_USER@$KBT_PROXY_ADDRESS" ./configs/$CONFIG_FILE $SERVER_USER@$SERVER_IP:$WORKING_PATH
    - ssh -p $KBT_PROXY_SSH_PORT -t $KBT_PROXY_USER@$KBT_PROXY_ADDRESS ssh -p $SERVER_PORT -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP
        "echo $DOCKER_REG_PASSWORD | docker login -u $DOCKER_REG_USERNAME $DOCKER_REG_URL --password-stdin
        && sudo docker pull $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest
        && (sudo docker rm -f sedie-service || true)
        && sudo docker run --name sedie-service -p 8082:8082 -v $WORKING_PATH/$CONFIG_FILE:/src/app-configs.js -d $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest
        && echo y | sudo docker image prune -a"

include:
  - local: .gitlab-ci/local.gitlab-ci.yml
  - local: .gitlab-ci/sit.gitlab-ci.yml